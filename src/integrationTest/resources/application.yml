jwt:
  secret: test-secret-key-that-is-long-enough-for-hs256-algorithm
  expiration: 3600000
server:
  port: 0
spring:
  application:
    name: InvestingTrackerIntegrationTest
  webflux:
    base-path: /api
  data:
    mongodb:
      # URI will be overridden by Testcontainers at runtime
      uri: mongodb://localhost:27017/test
      database: test
      ssl:
        enabled: false
    redis:
      # Host/port will be overridden by Testcontainers at runtime
      host: localhost
      port: 6379
      timeout: 5000ms
  mail:
    host: localhost
    port: 1025
    username: test
    password: test
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
app:
  base_url: http://localhost:8080

