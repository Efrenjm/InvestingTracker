jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}
server:
  port: 8080
spring:
  application:
    name: InvestingTracker
  webflux:
    base-path: /api
  ssl:
    bundle:
      pem:
        mongodb-bundle:
          keystore:
            certificate: ${MONGO_CERT_PATH}
            private-key: ${MONGO_CERT_PATH}
  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: ${MONGODB_DATABASE}
      ssl:
        enabled: true
        bundle: mongodb-bundle
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      username: ${REDIS_USERNAME}
      password: ${REDIS_PASSWORD}
      timeout: ${REDIS_TIMEOUT}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
app:
  base_url: ${BASE_URL}